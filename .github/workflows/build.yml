name: Build OP20 example
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Validate WebAssembly output
        run: node -e "const fs=require('fs'); if(!WebAssembly.validate(fs.readFileSync('build/MyToken.wasm'))) process.exit(1)"
